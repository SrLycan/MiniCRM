{% load static %}<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Órbita CRM: gestión simple de clientes.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Órbita CRM{% endblock %}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Sora:wght@600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script>
    // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
    document.documentElement.dataset.theme = localStorage.getItem("orbita-theme") || "dark";
  </script>
</head>
<body>
  {% include "partials/ambient.html" %}
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
